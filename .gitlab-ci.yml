
# DAT250 Group 17 LMS: build and test on merge requests and main.
# Frontend and backend are built independently and run in parallel.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - build

# Build the React app with Node.js.
frontend-build:
  stage: build
  image: node:26-bookworm-slim
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# Build and test Spring Boot with Java 25.
backend-build-test:
  stage: build
  image: eclipse-temurin:25-jdk
  script:
    - java -version
    - ./gradlew --no-daemon :backend:build
  artifacts:
    when: always
    paths:
      - backend/build/reports/tests/test/
    reports:
      junit: backend/build/test-results/test/TEST-*.xml
    expire_in: 1 week
