
# DAT250 Group 17 LMS: build and test on merge requests and main.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - frontend
  - backend

# Job 1: Build the React app with Node.js.
frontend-build:
  stage: frontend
  image: node:26-bookworm-slim
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# Job 2: Build and test Spring Boot with Java 25.
backend-build-test:
  stage: backend
  image: eclipse-temurin:25-jdk
  needs:
    - job: frontend-build
      artifacts: true
  script:
    - java -version
    - test -f frontend/dist/index.html
    - ./gradlew --no-daemon :backend:build -x :backend:installFrontend -x :backend:buildFrontend
    - test -f backend/build/resources/main/static/index.html
  artifacts:
    when: always
    paths:
      - backend/build/reports/tests/test/
    reports:
      junit: backend/build/test-results/test/TEST-*.xml
    expire_in: 1 week
