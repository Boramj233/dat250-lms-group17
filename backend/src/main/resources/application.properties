spring.application.name=backend
# TODO: Database configuration


# JWT resource server (Keycloak access tokens)
# Tokens are issued with the public URL the browser uses (iss claim), but the backend
# fetches the signing keys over the internal Docker network.
lms.security.issuer-uri=${KEYCLOAK_PUBLIC_URL:http://localhost:8081}/realms/lms
lms.security.jwk-set-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/lms/protocol/openid-connect/certs
# Only tokens issued to the LMS frontend client (azp claim) are accepted.
lms.security.client-id=lms-frontend

# H2 database
# jdbc:h2:file: -> file storage
# jdbc:h2:mem:testdb -> memory storage
spring.datasource.url=jdbc:h2:file:./data/backend
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
