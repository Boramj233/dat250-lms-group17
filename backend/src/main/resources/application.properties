spring.application.name=backend
# TODO: Database configuration


# OAuth 2.0 client: Spring Boot lets Keycloak handle the login (authorization code flow).
spring.security.oauth2.client.registration.keycloak.client-id=spring
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Keycloak endpoints. The browser is redirected to the public URL (localhost:8081); the
# backend exchanges the code and fetches signing keys over the internal URL
# (keycloak:8080 in Docker, localhost:8081 with bootRun). No issuer-uri: that would make
# Spring look up the endpoints via the public URL, which the container cannot reach.
# The issuer is checked explicitly instead (lms.security.issuer-uri).
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_PUBLIC_URL:http://localhost:8081}/realms/lms/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/lms/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/lms/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub
# Keycloak writes the public URL into the iss claim of its tokens.
lms.security.issuer-uri=${KEYCLOAK_PUBLIC_URL:http://localhost:8081}/realms/lms
# Still used by the Keycloak-JWT API chain until it is replaced by our own tokens.
lms.security.jwk-set-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/lms/protocol/openid-connect/certs
lms.security.client-id=lms-frontend

# Behind Vite/nginx: build redirect URIs from the browser's address (X-Forwarded-*).
server.forward-headers-strategy=framework

# Login session (only used by the login flow and GET /token, never by /api/**)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax


# H2 database
# jdbc:h2:file: -> file storage
# jdbc:h2:mem:testdb -> memory storage
spring.datasource.url=jdbc:h2:file:./data/backend
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
