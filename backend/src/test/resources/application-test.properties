# Isolated in-memory database; never use the development database in tests.
# H2 test database in memory storage
spring.datasource.url=jdbc:h2:mem:backend-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# H2 Web Console
spring.h2.console.enabled=false

# OAuth 2.0 client registration needs a secret; tests never contact Keycloak.
spring.security.oauth2.client.registration.keycloak.client-secret=test-client-secret

# Ordinary tests/build do not require RabbitMQ. Broker tests explicitly enable this.
lms.messaging.enabled=false
