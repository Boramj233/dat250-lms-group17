name: dat250-g17

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_DEMO_PASSWORD: ${KEYCLOAK_DEMO_PASSWORD:?Set KEYCLOAK_DEMO_PASSWORD in .env}
      # Substituted into the realm import as the secret of the "spring" client.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/lms-realm.json:/opt/keycloak/data/import/lms-realm.json:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    depends_on:
      - mailpit

  # Development mail server: catches every email Keycloak sends (verify email at
  # registration, forgot password). Read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"

  rabbitmq:
    image: rabbitmq:4.4.0-management
    hostname: lms-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-lms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: lms
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-lms}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      SPRING_RABBITMQ_VIRTUAL_HOST: lms

      # The backend is the OAuth 2.0 client "spring". The browser is sent to the public
      # Keycloak URL; the backend itself talks to Keycloak over the Docker network.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      KEYCLOAK_PUBLIC_URL: http://localhost:8081
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080

    # H2 file database (jdbc:h2:file:./data/backend, i.e. /app/data). Kept in a named
    # volume so users and courses survive "docker compose up --build backend".
    # "docker compose down -v" erases it.
    volumes:
      - backend-data:/app/data

    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

# TODO: Add SQL database (PostgreSQL) as a Docker-service
# TODO: Add NoSQL database (MongoDB or similar) as a Docker-service

volumes:
  keycloak-data:
  rabbitmq-data:
  backend-data:

